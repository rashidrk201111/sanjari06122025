version: '3.8'
services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    ports:
      - '8000:8000'
    environment:
      - DJANGO_SECRET_KEY=dev-secret
      - DEBUG=True
    command: gunicorn project.wsgi:application --bind 0.0.0.0:8000
