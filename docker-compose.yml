version: '3.8'

services:
  web:
    build: .
    container_name: sanjari-app
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs/nginx:/var/log/nginx
    networks:
      - sanjari-network

networks:
  sanjari-network:
    driver: bridge
